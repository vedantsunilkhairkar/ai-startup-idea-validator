[project]
name = "ai-startup-idea-validator"
version = "0.1.0"
description = "AI-powered decision support system to evaluate startup ideas using a 5-agent LangGraph workflow."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "asyncpg>=0.29.0",
    "pyjwt>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "google-genai>=0.1.0",
    "langchain-community>=0.3.0",
    "duckduckgo-search>=6.2.0",
    "tavily-python>=0.5.0",
    "pytrends>=4.9.2",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
]


[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"

