version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: ai-startup-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vedant123
      POSTGRES_DB: AI-Start-Validator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d AI-Start-Validator"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-startup-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:vedant123@db:5432/AI-Start-Validator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vedant123
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: AI-Start-Validator
      LLM_PROVIDER: gemini
      STARTUP_VALIDATOR_MODEL: gemini-3.8-flash
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      JWT_SECRET: pitchproof-jwt-secret-key-2026-production-secure
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      SEARCH_ENGINE: duckduckgo
      MAX_RESULTS: 5
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"

  # 3. React Frontend
  frontend:
    image: node:20-alpine
    container_name: ai-startup-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    command: sh -c "npm install && npm run build && npx vite preview --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
